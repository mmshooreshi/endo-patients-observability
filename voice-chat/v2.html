<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Audio Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.95);
            z-index: 10;
            transition: opacity 0.5s;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: transparent;
            color: #ff00ff; /* Neon Pink */
            border: 2px solid #ff00ff;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        #start-btn:hover {
            background: #ff00ff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.8);
        }
        .hidden { opacity: 0; pointer-events: none; }
        h1, p { text-shadow: 0 0 5px #ff00ff; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Real-Time Voice Visualizer</h1>
        <p>Please click to allow microphone access and see the immediate reaction.</p>
        <button id="start-btn">Start Experience</button>
    </div>
    
    <div id="canvas-container"></div>

    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const CONFIG = {
            colorA: new THREE.Color('#03001C'), // Very Dark Purple
            colorB: new THREE.Color('#3A0C8A'), // Deep Blue/Purple
            accent: new THREE.Color('#FF00FF'), // Bright Neon Pink
            // High smoothing factor (close to 1.0) for real-time reactivity
            SNAPPINESS: 0.8 
        };

        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = CONFIG.colorA;
        scene.fog = new THREE.FogExp2(CONFIG.colorA, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 8);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- Audio Setup ---
        let analyser, dataArray;
        let isAudioRunning = false;
        const uniformData = {
            low: 0,
            mid: 0,
            high: 0
        };

        async function initAudio() {
            try {
                // Check and resume context if needed
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.5; // Minimal hardware smoothing
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isAudioRunning = true;
                
                document.getElementById('overlay').classList.add('hidden');
            } catch (err) {
                console.error("Audio init failed:", err);
                // Custom modal instead of alert
                document.getElementById('overlay').innerHTML = `
                    <h1>Microphone Error</h1>
                    <p>Failed to access microphone. Please ensure permissions are granted and try refreshing.</p>
                `;
            }
        }

        // --- Shader Material ---
        
        const vertexShader = `
            #define attribute in
            #define varying out
            
            uniform float uTime;
            uniform float uLowFreq;
            uniform float uMidFreq;
            uniform float uHighFreq;
            
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vDisplacement;
            varying vec3 vViewPosition;
            varying vec2 vUv;

            // --- HELPER FUNCTIONS DEFINED FIRST ---
            // Helper for inverse sqrt
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            // Fixed: Changed from vec3 to vec4 to match usage in the noise algorithm
            vec4 permute(vec4 x) { return mod(((x*34.0)+1.0)*x, 289.0); }

            float snoise(vec3 v){
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);

                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;

                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );

                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;

                i = mod(i, 289.0 );
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));

                float n_ = 0.142857142857; // 1.0/7.0
                vec3  ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );

                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);

                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;

                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), 
                                            dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vUv = uv;
                vNormal = normal;
                
                // --- Layered Noise System ---
                
                // Base (Breathing) uses uLowFreq
                float noiseBase = snoise(position * 0.8 + vec3(uTime * 0.1));
                float displacementBase = noiseBase * (0.3 + uLowFreq * 1.5); 

                // Flow (Midrange) uses uMidFreq
                float noiseFlow = snoise(position * 1.5 + vec3(0.0, uTime * 0.6, 0.0));
                float displacementFlow = noiseFlow * (uMidFreq * 1.5); // Increased magnitude

                // Detail (High Freq) uses uHighFreq
                float noiseDetail = snoise(position * 4.0 + vec3(uTime * 1.5));
                float displacementDetail = noiseDetail * (uHighFreq * 0.8); // Increased magnitude

                // Combine layers
                float totalDisplacement = displacementBase + displacementFlow + displacementDetail;
                
                vDisplacement = totalDisplacement;

                // Apply displacement along normal
                vec3 newPosition = position + normal * totalDisplacement;
                
                vec4 modelViewPosition = modelViewMatrix * vec4(newPosition, 1.0);
                vViewPosition = -modelViewPosition.xyz;
                vPosition = newPosition;

                gl_Position = projectionMatrix * modelViewPosition;
            }
        `;

        const fragmentShader = `
            #define varying in
            precision highp float;

            uniform float uTime;
            uniform vec3 uColorA;
            uniform vec3 uColorB;
            uniform vec3 uColorAccent;
            uniform float uLowFreq;
            
            varying vec3 vNormal;
            varying float vDisplacement;
            varying vec3 vViewPosition;
            varying vec2 vUv;

            void main() {
                // Base Gradient Color based on displacement
                float t = smoothstep(-1.0, 1.0, vDisplacement);
                vec3 color = mix(uColorA, uColorB, t);

                // Fresnel Effect (Rim Lighting)
                vec3 viewDir = normalize(vViewPosition);
                vec3 normal = normalize(vNormal);
                float fresnelTerm = dot(viewDir, normal);
                fresnelTerm = clamp(1.0 - fresnelTerm, 0.0, 1.0);
                fresnelTerm = pow(fresnelTerm, 3.0);
                
                // Add a stronger, pulsing glow based on low frequency/volume
                float pulseIntensity = clamp(uLowFreq * 2.0, 0.0, 1.0);
                
                // Dynamic Accent Color Mixing
                color = mix(color, uColorAccent, pulseIntensity * 0.1); // Inner glow
                color += uColorAccent * fresnelTerm * (0.5 + pulseIntensity * 0.5); // Stronger rim light

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const uniforms = {
            uTime: { value: 0 },
            uLowFreq: { value: 0 },
            uMidFreq: { value: 0 },
            uHighFreq: { value: 0 },
            uColorA: { value: CONFIG.colorA },
            uColorB: { value: CONFIG.colorB },
            uColorAccent: { value: CONFIG.accent }
        };

        // --- Mesh ---
        const geometry = new THREE.IcosahedronGeometry(2, 60);
        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: uniforms,
        });

        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // --- Post Processing / Background particles ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1000;
        const posArray = new Float32Array(starsCount * 3);
        for(let i=0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 50;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMat = new THREE.PointsMaterial({ size: 0.05, color: CONFIG.accent, transparent: true, opacity: 0.5 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);


        // --- Animation Loop ---
        function analyzeAudio() {
            if (!isAudioRunning || !analyser) return;

            analyser.getByteFrequencyData(dataArray);

            let lowSum = 0, midSum = 0, highSum = 0;
            const lowBound = 10;
            const midBound = 80;

            for(let i = 0; i < dataArray.length; i++) {
                let val = dataArray[i] / 255.0; // Normalize 0-1
                if (i < lowBound) lowSum += val;
                else if (i < midBound) midSum += val;
                else highSum += val;
            }

            uniformData.low = lowSum / lowBound;
            uniformData.mid = midSum / (midBound - lowBound);
            uniformData.high = highSum / (dataArray.length - midBound);
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            
            analyzeAudio();

            // Set the smoothing factor to be very high (0.8) for maximum snappiness.
            const snappiness = CONFIG.SNAPPINESS;

            uniforms.uTime.value = time;
            
            // Prioritize responsiveness: use a high LERP factor
            uniforms.uLowFreq.value = THREE.MathUtils.lerp(uniforms.uLowFreq.value, uniformData.low, snappiness);
            uniforms.uMidFreq.value = THREE.MathUtils.lerp(uniforms.uMidFreq.value, uniformData.mid, snappiness);
            uniforms.uHighFreq.value = THREE.MathUtils.lerp(uniforms.uHighFreq.value, uniformData.high, snappiness);
            
            // Minimal rotation
            sphere.rotation.x = time * 0.05;
            sphere.rotation.y = time * 0.07;
            
            stars.rotation.y = time * 0.05;
            
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Event Listeners ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('start-btn').addEventListener('click', initAudio);

        animate();

    </script>
</body>
</html>
