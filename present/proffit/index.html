<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazir-font@30.1.0/dist/font-face.min.css">
    <title>Orthodontic Slide Viewer (Proffit)</title>
    <style>
        /* Global & Reset */
        :root {
            --color-dark: #1e1e1e;
            --color-light: #f0f0f0;
            --color-accent: #00bcd4; /* Cyan */
            --color-highlight-yellow: #ffeb3b;
            --color-highlight-pink: #ff4081;
            --color-figure: #333333;
            --font-size-title: 2rem;
            --font-size-heading: 1.3rem;
            --font-size-content: 1rem;
        }
        * {
            font-family: 'Vazir', 'Arial', sans-serif;
        }

        body {
            background-color: var(--color-dark);
            color: var(--color-light);
            font-family: 'Vazir', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.2;
        }

        /* Slide Container */
        #slide-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .slide {
            background: #282c34;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 1200px;
            min-height: 600px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            border-right: 8px solid var(--color-accent); /* ADHD Visual Anchor */
        }
        
        .slide.active {
            opacity: 1;
            transform: scale(1);
        }

        /* Content Styling */
        .slide h1, .slide h2 {
            color: var(--color-accent);
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: var(--font-size-title);
            font-weight: 700;
        }

        .slide h3 {
            font-size: var(--font-size-heading);
            color: var(--color-highlight-yellow);
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .slide ul, .slide ol {
            padding-right: 30px;
            margin-bottom: 20px;
        }

        .slide li {
            margin-bottom: 15px;
            font-size: var(--font-size-content);
        }

        /* Custom Markdown Formatting */
        .slide b {
            color: var(--color-highlight-pink);
            font-weight: 800;
        }
        .slide u {
            text-decoration-color: var(--color-accent);
            text-decoration-thickness: 3px;
        }
        .slide .highlight { /* For <h> tags in the source */
            background-color: rgba(255, 235, 59, 0.15); /* Soft yellow background */
            color: var(--color-highlight-yellow);
            padding: 2px 5px;
            border-radius: 4px;
        }
        
        /* Presenter Notes Styling */
        #notes-display {
            font-family: 'Vazir', 'Tahoma', sans-serif; /* A clearer Persian font if available */
            direction: rtl;
            text-align: right;
            line-height: 2.2; /* Generous line height */
            color: #ccc;
            font-size: 1.5rem;
        }
        #notes-display h3 {
            color: var(--color-highlight-pink);
            font-size: 2rem;
            margin-top: 0;
        }
        #notes-display ul {
             list-style-type: '★ ';
        }

        /* Figure Placeholder */
        .figure-box {
            background-color: var(--color-figure);
            color: #ddd;
            border: 2px dashed var(--color-highlight-yellow);
            padding: 15px;
            margin: 20px 0;
            font-style: italic;
            border-radius: 8px;
            max-width: 80%;
            font-size: 1.1rem;
        }
        .figure-box strong {
            color: var(--color-highlight-yellow);
            display: block;
            margin-bottom: 5px;
        }

        /* Controls */
        #controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: #111;
            border-top: 1px solid #333;
        }

        .nav-button {
            background-color: var(--color-accent);
            color: var(--color-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s, opacity 0.3s;
            font-weight: bold;
        }

        .nav-button:hover:not(:disabled) {
            background-color: #0097a7;
        }

        .nav-button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        /* Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            color: var(--color-light);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            margin: 0 15px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--color-accent);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>

    <div id="slide-container">
        </div>

        <button class="nav-button" id="prev-btn" disabled>← Previous</button>
        
        <div class="toggle-container">

                <span class="slider"></span>
            </label>
        </div>

        <div id="slide-info"></div>

        <button class="nav-button" id="next-btn">Next →</button>
    </div>

            },
            {
                title: "Headgear Treatment",
                content: "<h2>Headgear Treatment</h2><ul><li><b>High-pull headcap:</b> Places a superior and distal force on teeth and maxilla.</li><li><b>Cervical neckstrap:</b> Places an inferior and distal force.</li><li>Headgear force can <span class=\"highlight\">decrease the amount of forward and/or downward growth of the maxilla</span>.</li><li>Class II correction is obtained as the mandible grows normally while maxilla is restrained.</li></ul>",
                notes: "<h3>نکات برای سخنران:</h3><ul><li>مکانیزم: 'ترمز کردن' فک بالا.</li><li>های-پول (High-pull): نیرو به سمت بالا (مناسب صورت کشیده).</li><li>سرویکال (Cervical): نیرو به سمت پایین (مناسب صورت کوتاه).</li></ul>"
            },
            {
                title: "Vertical Control Importance",
                content: "<h2>Vertical Control Importance</h2><ul><li>To correct a Class II, the mandible needs to grow forward relative to the maxilla.</li><li>Important to control the vertical position of the maxilla and posterior teeth.</li><li><b>Downward movement</b> of maxilla or molars tends to project mandibular growth more vertically, which <span class=\"highlight\">nullifies most of the forward mandibular growth</span>.</li></ul>",
                notes: "<h3>نکات برای سخنران:</h3><ul><li>مهمترین نکته: چرخش فک.</li><li>خطر: اگر دندان‌های آسیا بلند شوند (Extrusion)، فک پایین به عقب می‌چرخد و درمان شکست می‌خورد.</li></ul>"
            }
        ];

        // --- CORE APPLICATION LOGIC ---
        let currentSlideIndex = 0;
        const slideContainer = document.getElementById('slide-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const notesToggle = document.getElementById('notes-toggle');
        const slideInfo = document.getElementById('slide-info');
        
        // --- Initialization and Persistence ---
        function initialize() {
            // Load toggle state from localStorage
            const storedToggle = localStorage.getItem('notesMode');
            if (storedToggle === 'on') {
                notesToggle.checked = true;
            } else {
                notesToggle.checked = false;
            }

            // Load last slide index (optional, but good practice)
            const storedIndex = parseInt(localStorage.getItem('currentSlideIndex') || '0', 10);
            currentSlideIndex = Math.min(storedIndex, slideData.length - 1);
            
            renderSlide(currentSlideIndex);
            attachEventListeners();
        }

        // --- Rendering Logic ---
        function renderSlide(index) {
            if (index < 0 || index >= slideData.length) return;

            const slide = slideData[index];
            const isNotesMode = notesToggle.checked;

            const newSlide = document.createElement('div');
            newSlide.className = 'slide';

            if (isNotesMode) {
                // Presenter Notes Mode
                newSlide.id = 'notes-display';
                newSlide.innerHTML = `<h1>Presenter Notes: ${slide.title}</h1>${slide.notes}`;
                newSlide.setAttribute('dir', 'rtl');
            } else {
                // Content Slide Mode
                newSlide.innerHTML = slide.content;
                newSlide.setAttribute('dir', 'ltr'); 
            }

            // Handle transition and replacement
            const currentSlide = slideContainer.querySelector('.slide');
            if (currentSlide) {
                currentSlide.classList.remove('active');
                
                // Use a short timeout for the fade transition
                setTimeout(() => {
                    slideContainer.innerHTML = '';
                    slideContainer.appendChild(newSlide);
                    setTimeout(() => newSlide.classList.add('active'), 10); // Trigger fade-in
                }, 500); 
            } else {
                slideContainer.appendChild(newSlide);
                setTimeout(() => newSlide.classList.add('active'), 10);
            }

            updateControls(index);
        }

        // --- Control & UI Updates ---
        function updateControls(index) {
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === slideData.length - 1;
            slideInfo.textContent = `Slide ${index + 1} of ${slideData.length}`;
            localStorage.setItem('currentSlideIndex', index.toString());
        }

        // --- Navigation Handlers ---
        function navigate(direction) {
            let newIndex = currentSlideIndex + direction;
            if (newIndex >= 0 && newIndex < slideData.length) {
                currentSlideIndex = newIndex;
                renderSlide(currentSlideIndex);
            }
        }

        // --- Event Listeners ---
        function attachEventListeners() {
            prevBtn.addEventListener('click', () => navigate(-1));
            nextBtn.addEventListener('click', () => navigate(1));

            notesToggle.addEventListener('change', (e) => {
                const mode = e.target.checked ? 'on' : 'off';
                localStorage.setItem('notesMode', mode);
                renderSlide(currentSlideIndex);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    navigate(-1);
                } else if (e.key === 'ArrowRight') {
                    navigate(1);
                }
            });
        }

        // Run the application
        initialize();
    </script>
</body>
