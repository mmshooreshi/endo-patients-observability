<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vector Hoops: Limitless</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');

        :root {
            --neon: #00ffcc;
            --glass: rgba(0, 20, 20, 0.85);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Rajdhani', sans-serif;
            color: var(--neon);
            touch-action: none; /* Critical for custom gestures */
        }

        #canvas-layer { position: absolute; top: 0; left: 0; z-index: 1; }

        /* --- HUD --- */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
        }

        .score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            text-shadow: 0 0 10px var(--neon);
        }
        .score-big { font-size: 48px; font-weight: bold; line-height: 1; }

        /* --- Controls --- */
        
        /* Vertical Zoom Slider */
        .zoom-container {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            height: 60%;
            width: 40px;
            pointer-events: auto;
            background: var(--glass);
            border: 1px solid var(--neon);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Standard Range Styling */
        input[type=range][orient=vertical] {
            writing-mode: bt-lr; /* IE/Edge */
            -webkit-appearance: slider-vertical; /* Webkit */
            width: 8px;
            height: 90%;
            padding: 0 5px;
        }
        
        /* Modern Vertical Range Hack for Cross-browser */
        .vert-range {
            transform: rotate(-90deg);
            width: 40vh; /* Based on container height */
            height: 40px;
            background: transparent;
            cursor: pointer;
        }

        /* --- Config Modal --- */
        #config-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--glass);
            border: 1px solid var(--neon);
            color: var(--neon);
            width: 40px; height: 40px;
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            transition: 0.2s;
        }
        #config-btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }

        #config-modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 400px;
            max-height: 80vh;
            background: rgba(0, 10, 10, 0.95);
            border: 1px solid var(--neon);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            pointer-events: auto;
            overflow-y: auto;
            display: none;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2);
        }
        #config-modal.open { display: block; }

        .control-group { margin-bottom: 15px; }
        .control-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .control-slider { width: 100%; accent-color: var(--neon); }

        .close-btn {
            width: 100%;
            padding: 10px;
            background: var(--neon);
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #interaction-hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            opacity: 0.5;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="score-board">
            <div>SCORE</div>
            <div class="score-big" id="score-val">0</div>
        </div>

        <div class="zoom-container">
            <!-- Vertical Slider -->
            <input type="range" min="10" max="200" value="60" class="vert-range" id="zoom-slider">
        </div>

        <button id="config-btn">⚙</button>

        <div id="interaction-hint">
            1 FINGER: AIM • 2 FINGERS: ROTATE
        </div>
    </div>

    <!-- Configuration Modal -->
    <div id="config-modal">
        <h3 style="margin-top:0; text-align:center;">SYSTEM CALIBRATION</h3>
        
        <div class="control-group">
            <div class="control-label"><span>Gravity Y</span><span id="val-grav">-20</span></div>
            <input type="range" class="control-slider" id="inp-grav" min="-100" max="20" value="-20">
        </div>

        <div class="control-group">
            <div class="control-label"><span>Ball Bounciness</span><span id="val-rest">0.7</span></div>
            <input type="range" class="control-slider" id="inp-rest" min="0.1" max="1.5" step="0.1" value="0.7">
        </div>

        <div class="control-group">
            <div class="control-label"><span>Time Scale</span><span id="val-time">1.0</span></div>
            <input type="range" class="control-slider" id="inp-time" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>

        <hr style="border-color: #333">

        <div class="control-group">
            <div class="control-label"><span>Bloom Strength</span><span id="val-bloom">1.5</span></div>
            <input type="range" class="control-slider" id="inp-bloom" min="0" max="10" step="0.1" value="1.5">
        </div>

        <div class="control-group">
            <div class="control-label"><span>Camera Height</span><span id="val-camh">15</span></div>
            <input type="range" class="control-slider" id="inp-camh" min="1" max="100" value="15">
        </div>

         <div class="control-group">
            <div class="control-label"><span>Camera FOV</span><span id="val-fov">50</span></div>
            <input type="range" class="control-slider" id="inp-fov" min="10" max="170" value="50">
        </div>

        <hr style="border-color: #333">

        <div class="control-group">
            <div class="control-label"><span>Hoop Height</span><span id="val-hooph">18</span></div>
            <input type="range" class="control-slider" id="inp-hooph" min="5" max="50" value="18">
        </div>
        
        <div class="control-group">
            <div class="control-label"><span>Hoop Distance</span><span id="val-hoopz">-25</span></div>
            <input type="range" class="control-slider" id="inp-hoopz" min="-100" max="-5" value="-25">
        </div>

        <button class="close-btn" id="modal-close">APPLY & CLOSE</button>
        <button class="close-btn" style="background:#333; color:#fff; margin-top:5px;" id="reset-view">RESET VIEW</button>
    </div>

    <div id="canvas-layer"></div>

    <!-- IMPORT MODULES -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import * as CANNON from 'cannon-es';

        // --- GLOBAL CONFIG & STATE ---
        const PARAMS = {
            gravity: -20,
            restitution: 0.7,
            timeScale: 1.0,
            bloomStrength: 1.5,
            camHeight: 15,
            fov: 50,
            hoopHeight: 18,
            hoopZ: -25,
            ballSize: 1.3
        };

        const STATE = {
            score: 0,
            balls: [],
            isDragging: false,
            dragStart: new THREE.Vector2(),
            dragCurrent: new THREE.Vector2(),
            camOrbit: 0, // Radians around Y axis
            camDist: 60 // Controlled by Zoom Slider
        };

        // --- ENGINE VARS ---
        let scene, camera, renderer, composer;
        let world, floorBody;
        let hoopGroup, hoopBodyParts = [];
        let raycaster, dragPlane;
        
        // --- INIT ---
        function init() {
            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.FogExp2(0x020202, 0.015);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(PARAMS.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraPosition();

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-layer').appendChild(renderer.domElement);

            // 4. Post Processing (Bloom)
            const renderPass = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0;
            bloomPass.strength = PARAMS.bloomStrength;
            bloomPass.radius = 0.5;
            
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            // 5. Physics World
            world = new CANNON.World();
            world.gravity.set(0, PARAMS.gravity, 0);

            // 6. Build Scene
            buildFloor();
            buildHoop();
            setupAimLine();

            // 7. Events
            bindEvents();
            
            // 8. Loop
            requestAnimationFrame(animate);
        }

        // --- BUILDERS ---
        function buildFloor() {
            // Physics
            const mat = new CANNON.Material();
            floorBody = new CANNON.Body({
                mass: 0, // Static
                shape: new CANNON.Plane(),
                material: mat
            });
            floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(floorBody);

            // Visual Grid
            const grid = new THREE.GridHelper(200, 40, 0x00ffcc, 0x111111);
            grid.position.y = 0.05;
            scene.add(grid);
        }

        function buildHoop() {
            if(hoopGroup) {
                scene.remove(hoopGroup);
                hoopBodyParts.forEach(b => world.removeBody(b));
                hoopBodyParts = [];
            }

            hoopGroup = new THREE.Group();
            hoopGroup.position.set(0, PARAMS.hoopHeight, PARAMS.hoopZ);
            scene.add(hoopGroup);

            // Material
            const hoopMat = new THREE.LineBasicMaterial({ color: 0xff00ff });
            const bbMat = new THREE.LineBasicMaterial({ color: 0x00ffcc });

            // Backboard Visual
            const bbGeo = new THREE.BoxGeometry(16, 11, 0.5);
            const bbEdges = new THREE.EdgesGeometry(bbGeo);
            const bbLines = new THREE.LineSegments(bbEdges, bbMat);
            bbLines.position.set(0, 4, -5);
            hoopGroup.add(bbLines);

            // Backboard Physics
            const bbBody = new CANNON.Body({ type: CANNON.Body.STATIC });
            bbBody.addShape(new CANNON.Box(new CANNON.Vec3(8, 5.5, 0.25)), new CANNON.Vec3(0, 4, -5));
            // Offset logic handled by setting body position to group position + local
            bbBody.position.set(0, PARAMS.hoopHeight + 4, PARAMS.hoopZ - 5);
            world.addBody(bbBody);
            hoopBodyParts.push(bbBody);

            // Rim Visual
            const rimRadius = 4.5;
            const rimGeo = new THREE.TorusGeometry(rimRadius, 0.2, 8, 32);
            const rimEdges = new THREE.EdgesGeometry(rimGeo);
            const rimLines = new THREE.LineSegments(rimEdges, hoopMat);
            rimLines.rotation.x = Math.PI / 2;
            hoopGroup.add(rimLines);

            // Rim Physics (Ring of spheres)
            const segs = 16;
            for(let i=0; i<segs; i++) {
                const angle = (i/segs) * Math.PI*2;
                const x = Math.cos(angle) * rimRadius;
                const z = Math.sin(angle) * rimRadius;
                const b = new CANNON.Body({ type: CANNON.Body.STATIC });
                b.addShape(new CANNON.Sphere(0.2));
                b.position.set(x, PARAMS.hoopHeight, PARAMS.hoopZ + z);
                world.addBody(b);
                hoopBodyParts.push(b);
            }
        }

        let aimLine, aimGeo;
        function setupAimLine() {
            aimGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
            aimLine = new THREE.Line(aimGeo, new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 2 }));
            aimLine.frustumCulled = false;
            aimLine.visible = false;
            scene.add(aimLine);
        }

        // --- BALL SYSTEM ---
        function shootBall(velocity) {
            // Physics
            const mat = new CANNON.Material();
            const contact = new CANNON.ContactMaterial(mat, mat, { 
                restitution: PARAMS.restitution, 
                friction: 0.3 
            });
            world.addContactMaterial(contact);

            const body = new CANNON.Body({
                mass: 5,
                shape: new CANNON.Sphere(PARAMS.ballSize),
                material: mat,
                position: new CANNON.Vec3(STATE.dragStart.x, 2, STATE.dragStart.y) // Y in THREE is Z in 2D vector
            });
            
            // Three JS coords: X is Left/Right, Y is Up, Z is Fwd/Back
            // Vector logic: Pulling BACK (+Z) shoots FWD (-Z)
            body.velocity.set(velocity.x, velocity.y, velocity.z);
            body.angularVelocity.set(Math.random()*5, 0, 0); // Spin
            
            world.addBody(body);

            // Visual
            const geo = new THREE.IcosahedronGeometry(PARAMS.ballSize, 1);
            const edges = new THREE.EdgesGeometry(geo);
            const mesh = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            scene.add(mesh);

            STATE.balls.push({ body, mesh, life: 300 });

            // Haptic
            if(navigator.vibrate) navigator.vibrate(20);
        }

        // --- INPUT HANDLING (THE FIX) ---
        function bindEvents() {
            const canvas = renderer.domElement;
            raycaster = new THREE.Raycaster();
            dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

            let lastTouchX = 0;

            // TOUCH START
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                
                if (e.touches.length === 1) {
                    // MODE 1: AIM
                    STATE.isDragging = true;
                    updateDragVectors(e.touches[0].clientX, e.touches[0].clientY, true);
                } else if (e.touches.length === 2) {
                    // MODE 2: ROTATE CAMERA
                    STATE.isDragging = false; // Cancel aim if 2nd finger drops
                    aimLine.visible = false;
                    lastTouchX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                }
            }, { passive: false });

            // TOUCH MOVE
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();

                if (e.touches.length === 1 && STATE.isDragging) {
                    updateDragVectors(e.touches[0].clientX, e.touches[0].clientY, false);
                } else if (e.touches.length === 2) {
                    // Rotate Logic
                    const currentX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const delta = currentX - lastTouchX;
                    STATE.camOrbit -= delta * 0.01; // Sensitivity
                    lastTouchX = currentX;
                    updateCameraPosition();
                }
            }, { passive: false });

            // TOUCH END
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (STATE.isDragging && e.touches.length === 0) {
                    STATE.isDragging = false;
                    aimLine.visible = false;
                    
                    // Fire!
                    const force = getLaunchForce();
                    if(force.length() > 2) shootBall(force);
                }
            }, { passive: false });

            // MOUSE (Fallback)
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 2) return; // Right click ignore
                STATE.isDragging = true;
                updateDragVectors(e.clientX, e.clientY, true);
            });
            canvas.addEventListener('mousemove', (e) => {
                if (STATE.isDragging) updateDragVectors(e.clientX, e.clientY, false);
                // Right click drag for rotate
                if (e.buttons === 2) {
                    STATE.camOrbit -= e.movementX * 0.005;
                    updateCameraPosition();
                }
            });
            window.addEventListener('mouseup', () => {
                if (STATE.isDragging) {
                    STATE.isDragging = false;
                    aimLine.visible = false;
                    const force = getLaunchForce();
                    if(force.length() > 2) shootBall(force);
                }
            });
            window.addEventListener('contextmenu', e => e.preventDefault());

            // --- UI BINDINGS ---
            
            // Zoom Slider
            const zoomSlider = document.getElementById('zoom-slider');
            zoomSlider.addEventListener('input', (e) => {
                STATE.camDist = parseFloat(e.target.value);
                updateCameraPosition();
            });

            // Config Logic
            bindConfigUI();
        }

        function updateDragVectors(screenX, screenY, isStart) {
            // Convert screen to 3D world on floor plane
            const mouse = new THREE.Vector2(
                (screenX / window.innerWidth) * 2 - 1,
                -(screenY / window.innerHeight) * 2 + 1
            );
            raycaster.setFromCamera(mouse, camera);
            const target = new THREE.Vector3();
            raycaster.ray.intersectPlane(dragPlane, target);

            if (target) {
                // We use 2D (x, z) for drag logic logic
                if (isStart) {
                    STATE.dragStart.set(target.x, target.z);
                }
                STATE.dragCurrent.set(target.x, target.z);
                
                // Visuals
                aimLine.visible = true;
                const pos = aimGeo.attributes.position.array;
                pos[0] = STATE.dragStart.x; pos[1] = 1; pos[2] = STATE.dragStart.y;
                pos[3] = target.x; pos[4] = 1; pos[5] = target.z;
                aimGeo.attributes.position.needsUpdate = true;
            }
        }

        function getLaunchForce() {
            const dx = STATE.dragStart.x - STATE.dragCurrent.x;
            const dz = STATE.dragStart.y - STATE.dragCurrent.y;
            
            // Dragging BACK (+Z in camera view usually) means shooting FWD
            // We scale inputs
            const power = 1.5;
            return new THREE.Vector3(dx * power, Math.abs(dz) * 0.8 + 5, -Math.abs(dz) * power * 1.5);
        }

        function updateCameraPosition() {
            // Orbit logic
            const y = PARAMS.camHeight;
            const radius = STATE.camDist;
            
            const x = Math.sin(STATE.camOrbit) * radius;
            const z = Math.cos(STATE.camOrbit) * radius;

            camera.position.set(x, y, z);
            camera.lookAt(0, PARAMS.hoopHeight / 2, -10);
        }

        function bindConfigUI() {
            const btn = document.getElementById('config-btn');
            const modal = document.getElementById('config-modal');
            const close = document.getElementById('modal-close');
            const reset = document.getElementById('reset-view');

            btn.onclick = () => modal.classList.add('open');
            close.onclick = () => modal.classList.remove('open');
            reset.onclick = () => {
                STATE.camOrbit = 0;
                document.getElementById('zoom-slider').value = 60;
                STATE.camDist = 60;
                updateCameraPosition();
                modal.classList.remove('open');
            };

            // Helper to bind slider to param
            const bind = (id, paramKey, displayId, action) => {
                const el = document.getElementById(id);
                const disp = document.getElementById(displayId);
                el.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    PARAMS[paramKey] = val;
                    disp.innerText = val;
                    if(action) action(val);
                });
            };

            bind('inp-grav', 'gravity', 'val-grav', (v) => world.gravity.set(0, v, 0));
            bind('inp-rest', 'restitution', 'val-rest'); // Updated in shoot
            bind('inp-time', 'timeScale', 'val-time');
            bind('inp-bloom', 'bloomStrength', 'val-bloom', (v) => composer.passes[1].strength = v);
            
            bind('inp-camh', 'camHeight', 'val-camh', updateCameraPosition);
            bind('inp-fov', 'fov', 'val-fov', (v) => { camera.fov = v; camera.updateProjectionMatrix(); });
            
            bind('inp-hooph', 'hoopHeight', 'val-hooph', buildHoop);
            bind('inp-hoopz', 'hoopZ', 'val-hoopz', buildHoop);
        }

        // --- LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta() * PARAMS.timeScale;
            
            // Physics
            world.step(1/60, dt, 3);

            // Sync Objects
            for (let i = STATE.balls.length - 1; i >= 0; i--) {
                const b = STATE.balls[i];
                b.mesh.position.copy(b.body.position);
                b.mesh.quaternion.copy(b.body.quaternion);
                
                // Cleanup
                b.life--;
                if (b.body.position.y < -50 || b.life <= 0) {
                    world.removeBody(b.body);
                    scene.remove(b.mesh);
                    STATE.balls.splice(i, 1);
                } else {
                    // Check Score (Simplified for brevity)
                    if(Math.abs(b.body.position.z - PARAMS.hoopZ) < 1 && 
                       Math.abs(b.body.position.x) < 2 &&
                       Math.abs(b.body.position.y - PARAMS.hoopHeight) < 1) {
                         // Simple visual feedback
                         STATE.score++;
                         document.getElementById('score-val').innerText = STATE.score;
                    }
                }
            }

            composer.render();
        }

        // Start
        init();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
